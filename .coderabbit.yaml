# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  path_instructions:
    - path: "src/charge.rs"
      instructions: |
        Hot path for money movement. Verify idempotency semantics against the
        contract in the linked contracts repo, and that validate_charge is always called.
    - path: "src/refund*.rs"
      instructions: |
        Refunds must: use integer minor units, require the idempotency key, never exceed the
        original charge, return typed errors, and respect the contract's MAX_CHARGE_MINOR.
        Compare field names/types to payments-contracts and cite the contract file.
    - path: "src/fees.rs"
      instructions: "Fee math must be integer basis points with documented rounding."
    - path: "Cargo.toml"
      instructions: |
        payments-contracts must be pinned to a tag. Check the tag exists in the
        contracts repo CHANGELOG and flag if a newer breaking tag is not yet adopted.
  pre_merge_checks:
    title:
      mode: warning
      requirements: "Start with feat:, fix:, or chore: and reference a PAY-### ticket."
    description:
      mode: warning
    issue_assessment:
      mode: warning
  tools:
    clippy:
      enabled: true
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "docs/**/*.md"
  learnings:
    scope: local
  linked_repositories:
    - repository: devopsmayur/rust-shared-contracts
      instructions: |
        payments-contracts crate: source of truth for Money, Currency, ChargeRequest,
        validate_charge, MAX_CHARGE_MINOR and IDEMPOTENCY_HEADER. Service code must conform to it.
